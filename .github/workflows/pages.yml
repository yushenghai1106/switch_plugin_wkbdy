name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy read-only demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build read-only demo
        run: npm run build:demo

      # ⚠️ 首次运行前需要在仓库 Settings → Pages 把 Source 设为 "GitHub Actions"（一次性）。
      #
      # 这里**不能**用 `enablement: true` 自动建站：创建 Pages 站点需要仓库 admin 权限，
      # 而 GITHUB_TOKEN 拿不到，实测报 "Resource not accessible by integration"，
      # 反而把「请先启用 Pages」这条可操作的提示盖掉了。
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
