name: build

# 发布形态：**插件 + npm 内核**，不再发布桌面安装包。
#
# - 插件本体随仓库分发：用户执行 `/plugin marketplace add <owner>/<repo>` 即可安装，
#   因此这里不需要产出任何插件资产。
# - 内核二进制走 npm 平台包（`@yushenghai/workbuddy-switch-<platform>-<arch>`），由插件的
#   `bin/ensure-runtime.mjs` 在首次运行时拉取。
# - GitHub Release 只作为版本记录（不再挂安装包与更新清单）。
#
# ⚠️ 发版前必须 bump 版本：`ensure-runtime` 用「插件版本 ≠ 内核缓存版本戳」判断是否
# 重新拉内核，版本不变就会继续用旧内核。`validate` job 会用 tag 校验这一点。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build. win-x64 produces a test build without a GitHub Release."
        type: choice
        default: all
        options:
          - all
          - win-x64
          - mac-arm64
          - mac-x64
          - linux-x64

permissions:
  contents: write

jobs:
  # 清单校验必须最先跑且要快：清单位置、`source` 基准、占位符替换后文件是否存在、
  # 版本一致性——这些错了插件就装不上，而官方 `codebuddy plugin validate` 在 CI 里
  # 跑不了（无 TTY 会静默挂起），所以自备一份纯静态校验。
  validate:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin layout
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/validate-plugin.mjs --expect-version="${GITHUB_REF_NAME#v}"
          else
            node scripts/validate-plugin.mjs
          fi

  select-matrix:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          all_platforms = [
              {
                  "name": "mac-arm64",
                  "os": "macos-14",
                  "target": "aarch64-apple-darwin",
                  "cli_bin": "wb-switch-darwin-arm64",
                  "platform_tag": "darwin-arm64",
              },
              {
                  "name": "mac-x64",
                  "os": "macos-14",
                  "target": "x86_64-apple-darwin",
                  "cli_bin": "wb-switch-darwin-x64",
                  "platform_tag": "darwin-x64",
              },
              {
                  "name": "win-x64",
                  "os": "windows-latest",
                  "target": "x86_64-pc-windows-msvc",
                  "cli_bin": "wb-switch-win32-x64.exe",
                  "platform_tag": "win32-x64",
              },
              {
                  "name": "linux-x64",
                  "os": "ubuntu-latest",
                  "target": "x86_64-unknown-linux-gnu",
                  "cli_bin": "wb-switch-linux-x64",
                  "platform_tag": "linux-x64",
              },
          ]
          event = os.environ.get("EVENT_NAME", "")
          platform = (os.environ.get("PLATFORM") or "all").strip()
          if event != "workflow_dispatch" or platform in ("", "all"):
              selected = all_platforms
          else:
              selected = [p for p in all_platforms if p["name"] == platform]
              if not selected:
                  raise SystemExit(f"unknown platform: {platform}")
          matrix = json.dumps({"include": selected})
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix<<EOF\n")
              f.write(matrix + "\n")
              f.write("EOF\n")
          PY

  build:
    name: ${{ matrix.name }}
    needs: [validate, select-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # 该 action 默认给 RUSTFLAGS 加 -D warnings，会把 vendor/agent-companion 快照
          # 在 linux cfg 下的 dead_code 告警升级成错误。发版构建不需要这层门禁
          # （自有代码的告警由 test.yml 的 lint job 把关）。
          rustflags: ""

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 前端构建产物由 CLI 二进制经 rust-embed 内嵌（webui 与按需打开的界面都用它）。
      - name: Build frontend
        run: |
          npm install
          npm run build

      # CLI 二进制：插件内核，也是 npm 平台包的内容。
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-switch-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin

      # 打包本平台包并发布到 npm（内核只走 npm registry，Release 不再留二进制）。
      # 仅 tag 发布；手动触发（例如只打 Windows 试装包）不得 npm publish。
      # 仓库变量 PUBLISH_NPM=false 时整段跳过：registry 维护/故障期间不阻塞发版。
      - name: Publish platform package
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_DIR="npm/platform/workbuddy-switch-${{ matrix.platform_tag }}"
          # 用 tag 版本同步 platform 包版本（git 里的可能滞后）
          VER="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/\"version\": \"[0-9.]+\"/\"version\": \"$VER\"/" "$PKG_DIR/package.json"
          mkdir -p "$PKG_DIR/bin"
          SRC="target/${{ matrix.target }}/release/wb-switch"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "$PKG_DIR/bin/${{ matrix.cli_bin }}"
          cd "$PKG_DIR"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

  # 所有平台包发布成功后，发布主包（optionalDependencies 引用平台包）
  publish-main:
    name: Publish npm main package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

  # Release 只作为版本记录：插件随仓库分发、内核走 npm，没有需要挂上去的资产。
  # 不依赖 publish-main——PUBLISH_NPM=false 时那个 job 会被跳过，若把它列进 needs，
  # 本 job 会跟着被跳过（GitHub 认为被跳过的依赖不算成功）。
  release:
    name: Create release
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 正文写清真正的安装与更新渠道：这里没有安装包可下，不说明会让人白找。
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 安装 / 更新

            本项目的发布形态是**插件 + npm 内核**，Release 不再提供安装包。

            - **插件（推荐）**：在 CodeBuddy / WorkBuddy 里执行
              - `/plugin marketplace add yushenghai1106/switch_plugin_wkbdy`
              - `/plugin install workbuddy-switch@wb-switch-market`
              - 然后完全重启客户端
            - **更新插件**：`/plugin update workbuddy-switch`
            - **内核 / webui**：`npm i -g @yushenghai/workbuddy-switch`（更新用 `npm update -g @yushenghai/workbuddy-switch`）

            内核二进制随本次发布的 npm 平台包分发（`@yushenghai/workbuddy-switch-<platform>-<arch>`），
            插件首次运行会自动拉取到 `~/.wb-switch/bin/`。
